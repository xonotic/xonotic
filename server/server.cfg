/////////////////////////////////////////////////////////////////////
// EXAMPLE SERVER CONFIG, some settings are mandatory to change!
// To use this, copy it to your config's data folder (see https://xonotic.org/faq/#config)
//   Linux: ~/.xonotic/data
//   Windows: C:\Users\<your_user_name>\Saved Games\xonotic\data
//   Mac: ~/Library/Application Support/xonotic/data

// Config format:
//   Two slashes (//) start a comment until the end of the line
//   Surround settings with double quotes (e.g., cvar_name "some value"), option if they're a single number or word
//   "" means empty string
//   Semicolon separates commands (in console or in aliases)

// Search for settings using the 'search' command in console in-game,
//   or online: https://xonotic.org/tools/cacs/
//   This can show you the default value and meaning of a cvar
//   Cvar means "console variable", i.e., setting



/////////////////////////////////////////////////////////////////////
// IMPORTANT server personalization cvars
// As with all cvars, remove the // at the start to make it take effect!

// Mandatory to change:
hostname "Default config Xonotic $g_xonoticversion Server"    // this name will appear on the server list (the $g_xonoticversion gets replaced with the current version)
sv_public 0                                                   // set to 1 to make the server public, set to 0 to allow direct connection via IP address, set to -1 to make it private (see description)
//sv_motd ""                                                  // text displayed on connect - good place for contact info (IRC, forum nick, etc.) so players can reach you when something is wrong with your server
//sv_termsofservice_url "https://yourdomain.tld/path/to/tos"  // URL for the Terms of Service for playing on your server
// Please supply a document containing information about how you collect and process user data (bridging to IRC, player stats etc.) if you server does that,
//   along with contact information, rules and similar information
//   This document will be shown in the server join dialog

// This sets the remote console password on the server, you also need to set the cvar to the same value on your client to use the 'rcon' command
rcon_password ""  // set to "" to disable rcon



/////////////////////////////////////////////////////////////////////
// Further server customization
//   These all have sensible defaults, so changing isn't mandatory
//   The values shown are either defaults or examples

//maxplayers 8      // number of player slots on the server (including spectators)
//g_maxplayers 0    // above this player count, only allow spectators
//g_start_delay 15  // delay in seconds before the game starts to let players join the server first
//sv_maxidle 0      // idle time in seconds after which players will get kicked

//sv_taunt 1      // set to 0 to disallow taunts
//sv_autotaunt 1  // set to 0 to disallow autotaunts

//net_address 0.0.0.0  // ONLY change this if you have problems with your server. Specifies the network interface used by the engine, set it to one of your internal IPs

port 26000  // port used by the server
// You are RECOMMENDED to change this value to a free port number on your server above 1024
//   The reason is that some bad ISPs might filter "gaming" ports, and changing the port your server runs on may make your server available to these people
//   Changing the port breaks nothing, the default simply matches Quake as we use a Quake-derived protocol

// GAMETYPE: what type of server do you want to host?
//   dm        Deathmatch
//   tdm       Team Deathmatch
//   ctf       Capture the Flag
//   ca        Clan Arena
//   ft        Freeze Tag
//   mayhem    Mayhem
//   tmayhem   Team Mayhem
//   ka        Keepaway
//   tka       Team Keepaway
//   kh        Key Hunt
//   lms       Last Man Standing
//   dom       Domination
//   nb        Nexball
//   ons       Onslaught
//   as        Assault
//   surv      Survival
//   rc        Race
//   cts       Complete the Stage
//   inv       Invasion
gametype dm         // default gametype
sv_vote_gametype 1  // set to 1 to enable voting for gametypes after every match
//sv_vote_gametype_options "dm kh dom tdm mycustom"                // the gametypes to vote for, custom gametypes are supported (max 9 chars for the gametype identifier because sv_vote_gametype_hook_* can have max 31 chars)
//set sv_vote_gametype_mycustom_name "My Custom Mode"              // name displayed for the custom gametype "mycustom" (replace "mycustom" with the name you set in sv_vote_gametype_options)
//set sv_vote_gametype_mycustom_type "ft"                          // the basetype that the custom gametype is derived from
//set sv_vote_gametype_mycustom_description "My custom gametype!"  // the description for the custom gametype
//   Custom icons for custom gametypes are supported and have to be located in a server pk3 as gfx/menu/wickedx/gametype_mycustom
//   You can change cvars or run commands in the custom gametype with e.g., sv_vote_gametype_hook_mycustom "g_instagib 1"

// MAPS: list of maps to play on the server
//   Set g_maplist to "" to autodetect (enumerates ALL maps)
//   Maps that don't support the current gametype will be skipped, so you don't need to remove them here
//g_maplist "afterslime atelier boil catharsis courtfun dance drain erbium finalrage fuse geoplanetary glowplant implosion leave_em_behind nexballarena oilrig runningman runningmanctf silentsiege solarium space-elevator stormkeep techassault vorix warfare xoylent"
//g_maplist_shuffle 1              // set to 0 to always select the next map out of g_maplist (but then better set g_maplist_votable 0 below to prevent repetitive votes), set to 1 to select random maps each time
//g_maplist_mostrecent_count 3     // number of maps that have to be played before a map can be repeated
//g_maplist_votable 6              // number of maps to vote between. Set to 0 to disable the map voting screen (please enable g_maplist_shuffle above when this is enabled, or maps will be repetitive)
//g_maplist_votable_suggestions 2  // number of suggestions to accept using the 'suggestmap' command
//g_maplist_votable_abstain 0      // set to 1 to enable the "Don't care" option in the vote screen
//g_maplist_votable_detail 0       // set to 0 to hide how many players voted for each map (to thwart influential first votes)

// LIMITS: how long a match will last before the next map starts (-1 means use the map default, 0 = unlimited, please note that the variables fraglimit/timelimit can NOT be globally used for this but only DURING a match is being played)
//timelimit_override -1     // global timelimit for all maps and gametypes
//fraglimit_override -1     // global frag/point limit for all maps and gametypes
//capturelimit_override -1  // capture limit for CTF
//g_lms_lives_override -1   // lives for LMS
//g_nexball_goallimit -1    // goals for Nexball
//g_tdm_point_limit -1      // frag/point limit for Team Deathmatch
//  These g_{gametype}_point_limit cvars also exist for: ca, freezetag, mayhem, tmayhem, keepaway, tka, keyhunt, domination, onslaught, and invasion

// TEAMS: number of teams in each gametype (0 means use the map default)
//g_tdm_teams_override 0  // teams in Team Deathmatch
//   These g_{gametype}_teams_override cvars also exist for: ca, freezetag, tmayhem, tka, keyhunt, and domination

// BOTS
//skill 8                // bots' skill level
//bot_prefix "[BOT]"     // text prepended to every bot's name, to make it clear they're not a human
//bot_suffix ""          // text appended to every bot's name
//minplayers 0           // add bots if less then that number of players playing
//minplayers_per_team 0  // add bots to each team if less than that number of players playing

//alias bots "minplayers 4; minplayers_per_team 2"  // this will be enacted if people 'vcall bots'
//g_maplist_check_waypoints 0                       // set to 1 to skip maps without waypoints if there aren't enough players to play without bots

// OTHER VOTING
//sv_vote_commands "restart fraglimit gotomap nextmap endmatch reducematchtime extendmatchtime allready kick cointoss movetoauto shuffleteams bots nobots"  // players can vote for those commands or use them if they are masters. You can also add 'g_grappling_hook' for hook voting, and 'sv_fbskin_green sv_fbskin_red sv_fbskin_orange sv_fbskin_off' for fbskin voting.
//sv_vote_master_commands "movetored movetoblue movetoyellow movetopink"  // add commands masters can use if logged in or elected. You may want to put 'kickban' here, so masters can keep out punks. It may be good to also put "sv_status_privacy 0" then...
//rcon_restricted_commands "restart fraglimit chmap gotomap endmatch reducematchtime extendmatchtime allready kick kickban \"sv_cmd bans\" \"sv_cmd unban\" status \"sv_cmd teamstatus\" movetoauto movetored movetoblue movetoyellow movetopink"  // commands for the (stronger) rcon restricted
//rcon_restricted_password ""  // put here the password for a "restricted" rcon user (see below)

//sv_vote_call 1                      // set to 0 to disable the normal voting
//sv_vote_master 1                    // set to 0 to disable voting to become master, good if you prefer to use the master password instead
//sv_vote_master_password ""          // when set, 'vlogin password_here' will allow people to become master to run master commands directly using 'vdo'
//sv_vote_majority_factor 0.5         // percentage of the PLAYERS constitute a majority to win a vote. Must be at least 0.5
//sv_vote_majority_factor_of_voted 0  // percentage of the VOTERS who already voted constitute a majority to win a vote. Must be at least 0.5
//   NOTE: to JUST support simple majorities, set these two factors equal



/////////////////////////////////////////////////////////////////////
// PRIVACY settings you might want to change

//sv_status_privacy 1  // set to 1 to hide IP addresses from "status" replies shown to clients, 0 shows them, enabling players to identify well-known punks on your server but reduces anonymity depending on your point of view
//sv_showfps 1         // set to 1 to show players' framerates on the scoreboard
//sv_showskill 1       // set to 1 to show players' XonStat skill ratings on the scoreboard, when available

// This line sends the following data to our servers:
// - Date and time
// - Your server IP address
// - Your server ID hash, which is a fingerprint of the public key of your server and doesn't impact security of your private key ('crypto_keys' in the console to show it)
// - Your server name ('hostname')
// - Current game type
// - Current map
// - Balance settings you have modified from defaults (only those that make your server "impure")
// - For each weapon pairing (A, B), separately for player-player, player-bot, bot-player, bot-bot pairings:
//   - Number of hits of players/bots holding A against players/bots holding B
//   - Number of frags of players/bots holding A against players/bots holding B
//   - Total damage of players/bots holding A against players/bots holding B
//
// We use this data to:
// - Optimize the game balance for future releases
// - Identify problems in the bot AI and improving it
// - Find settings that make servers "impure" that should not, so we can whitelist them in future releases
//
// We will or might publish:
// - Global weapon pairing statistics for players vs players, or bots vs bots, or any vs any, on a selection of servers
// - Per-gametype and per-map weapon pairing statistics players vs players, or bots vs bots, or any vs any, on a selection of servers
// - Lists of commonly changed cvars, together with counts on how often they are modified
//
// No information about the players on the server is sent without prior consent, so as a server admin you need no permission of your players for this
// No information about your server will be published - all published data sets will include data from multiple servers
sv_weaponstats_file "http://www.xonotic.org/weaponbalance/"



/////////////////////////////////////////////////////////////////////
// Some advanced settings

//sv_ready_restart_after_countdown 0  // set to 1 to reset player and map items after the countdown ended, otherwise they're reset already at the beginning of the countdown
//sv_autoscreenshot 0                 // set to 1 to force a screenshot for all clients when the map ends. Useful for competitions or the ladder

//g_antilag 2  // set to 0 to disable the antilag feature, 1 and 2 use different methods

//sv_maxrate 1000000  // limits client connections to this rate in bytes/seconds

//sys_ticrate 0.015625  // 0.03125 (32fps) for half as many server frames per second than default (64fps). May help reduce CPU use, at the cost of less smooth gameplay

//log_file "server.log"  // server console output will also be copied to this file. This: "${serverconfig}.log" uses variable substitution to make the logfile have the same name as your config file with .log appended, which is useful if you run several servers
//sv_curl_defaulturl http://www.xonotic.org/contentdownload/getmap.php?file=  // fallback download URL
//   See Docs/mapdownload.txt for more info

//sv_defaultcharacter 0                           // set to 1 to force a specific model for all players
//sv_defaultplayermodel models/player/erebus.iqm  // this model will be used
//sv_defaultplayerskin 0                          // this skin number will be forced for all players
//sv_defaultplayercolors ""                       // you can force player colors here (16*shirt+pants)
//g_fullbrightplayers 0                           // set to 1 to make players fullbright
//g_fullbrightitems 0                             // set to 1 to make items fullbright

//g_balance_teams 1                    // set to 0 to show players the team selection menu after joining instead of automatically putting them on the smaller team
//g_balance_teams_prevent_imbalance 1  // set to 0 to prevent switching to a bigger/better team

//g_spawnshieldtime 1  // time for which players are protected after spawn



/////////////////////////////////////////////////////////////////////
// Mutators that are allowed on a "pure" server

//g_instagib 0     // set to 1 for InstaGib
//g_weapon_stay 0  // set to 1, 2, or 3 for different weapon-stay modes (1 = traditional, 2 = no ammo but allow throwing, 3 = ghost weapon stay)
//g_powerups -1    // set to 0 to turn off Strength, Shield, Invisibility, and Speed, and set to 1 to turn them on even in gametypes that normally have them turned off

// Rulesets / Mods
//   To enable rulesets like Overkill, put 'exec ruleset-overkill.cfg' at the top of this file (above any other cvar changes)
//   Other rulesets: ruleset-instahook, ruleset-nexuiz, ruleset-XDF, ruleset-XPM



